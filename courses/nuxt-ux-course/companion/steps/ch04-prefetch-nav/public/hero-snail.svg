<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="hero-snail-title">
  <title id="hero-snail-title">一只背着螺旋壳的蜗牛，头顶一把绿色雨伞，伞外落着雨点</title>
  <!-- 雨（伞外才有雨：雨具店的招牌场景） -->
  <g stroke="#9ec3d8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M34 42 q-3 8 0 14" />
    <path d="M56 22 q-3 8 0 14" />
    <path d="M176 24 q-3 8 0 14" />
    <path d="M196 46 q-3 8 0 14" />
    <path d="M18 78 q-3 8 0 14" />
  </g>
  <!-- 雨伞：伞面、伞骨、伞杆与弯钩 -->
  <g>
    <path
      d="M82 62 A40 40 0 0 1 162 62 Q150 74 139 62 Q128 74 116 62 Q105 74 94 62 Q88 74 82 62 Z"
      fill="#1f7a5f" stroke="#17604b" stroke-width="3" stroke-linejoin="round"
    />
    <path d="M122 22 Q138 42 139 62 M122 22 Q106 42 105 62" fill="none" stroke="#17604b" stroke-width="2" />
    <path d="M122 22 V104 a7 7 0 0 1 -13 0" fill="none" stroke="#7c5f3f" stroke-width="4" stroke-linecap="round" />
  </g>
  <!-- 蜗牛：先画身体（头朝右），再叠螺旋壳 -->
  <g>
    <ellipse cx="112" cy="192" rx="76" ry="8" fill="#e8e1d3" />
    <path
      d="M50 184
         C50 170 62 164 78 162
         L138 156
         C150 154 156 148 158 138
         C159 129 167 123 175 123
         C185 123 191 131 191 141
         C191 151 184 158 174 160
         L174 186
         C174 190 170 192 166 192
         L58 192
         C53 192 50 189 50 184 Z"
      fill="#e6b95c" stroke="#c29436" stroke-width="3" stroke-linejoin="round"
    />
    <!-- 触角与眼睛 -->
    <g stroke="#c29436" stroke-width="3" stroke-linecap="round">
      <path d="M176 127 L184 106" fill="none" />
      <path d="M184 130 L196 110" fill="none" />
    </g>
    <circle cx="185" cy="103" r="5" fill="#fff" stroke="#c29436" stroke-width="2" />
    <circle cx="197" cy="107" r="5" fill="#fff" stroke="#c29436" stroke-width="2" />
    <circle cx="186.5" cy="104" r="1.9" fill="#4a3f2f" />
    <circle cx="198.5" cy="108" r="1.9" fill="#4a3f2f" />
    <!-- 嘴 -->
    <path d="M180 146 q5 4 10 0" fill="none" stroke="#a2672a" stroke-width="2.5" stroke-linecap="round" />
    <!-- 螺旋壳：链式半圆弧拼出的螺旋 -->
    <circle cx="104" cy="112" r="46" fill="#cf8b3e" stroke="#a2672a" stroke-width="3" />
    <path
      d="M104 112
         a8 8 0 0 1 16 0
         a12 12 0 0 1 -24 0
         a16 16 0 0 1 32 0
         a20 20 0 0 1 -40 0
         a24 24 0 0 1 48 0
         a28 28 0 0 1 -56 0
         a32 32 0 0 1 64 0
         a36 36 0 0 1 -72 0"
      fill="none" stroke="#a2672a" stroke-width="3" stroke-linecap="round"
    />
  </g>
</svg>
