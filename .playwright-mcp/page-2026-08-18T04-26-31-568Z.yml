        - paragraph [ref=f2e369]: 两道门槛在 companion/ 下跑：pnpm run typecheck 加 pnpm test——85 条断言全绿，其中旧 77 条一字未动，新 8 条是本章里程碑。手算对账挑几笔：checkerboard(8, 4) 总字节数 = 8²×4 = 256；像素 (0,0)（数组前 4 个字节）是 (0,0,0,255)——左下角原点约定；沿底边一行数颜色段、沿左边一列数颜色段，段数都恰是 cells；任取相邻两格的中心像素，必是一黑一白。立方体那边：24 个顶点的 UV 全在 [0,1]，六面每面 min=0、max=1，且四个角点严格按左下→右下→右上→左上依次 (0,0)(1,0)(1,1)(0,1)——贴图不需要旋转就铺满每面。
