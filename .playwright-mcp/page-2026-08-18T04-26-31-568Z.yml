            - listitem [ref=f2e357]: 纹理 128×128、RGBA 逐像素 4 字节，共 65536 字节——代码生成（Uint8Array），零图片文件；左下角格染红是方向标记。
            - listitem [ref=f2e358]: 接线五步：createTexture → bindTexture → pixelStorei + texImage2D → texParameteri（过滤/包裹）→ activeTexture(TEXTURE0) + uniform1i 把采样器指到 0 号单元。
            - listitem [ref=f2e359]: MIN_FILTER 与 MAG_FILTER 设成同一档：默认的 NEAREST_MIPMAP_LINEAR 要多级渐远纹理才完整，本章不做 mipmap，把它绕开。
          - paragraph [ref=f2e360]: 立方体每面铺满一张 [0,1] 的程序化棋盘格：UV 在顶点表里写好，varying 插值到片元，texture2D 采样上色
        - paragraph [ref=f2e361]: 演示是一颗贴棋盘格的旋转立方体，开关与滑杆排在画布上方，账目与判词在画布下方。纹理 128×128 全程序化生成，零图片文件；左下角格染红，是给你看方向用的标记（实验场的 checkerboard 约定该格为黑，纯黑白）。按这几步玩：
        - list [ref=f2e362]:
          - listitem [ref=f2e363]: 格子密度滑杆从 2×2 拉到 32×32：每次都是重新生成纹理数据再上传——顶点表一个字节没动，这就是「细节住在纹理里」。
          - listitem [ref=f2e364]: 勾上特写再切 NEAREST/LINEAR：贴近看格边——NEAREST 是马赛克块加锯齿，LINEAR 把边缘调出过渡灰。开章那笔糊成彩色锯齿的账，就是这个开关。
          - listitem [ref=f2e365]: 勾上「UV 放大到 [0,3]」再切 REPEAT/CLAMP：REPEAT 把一张贴图平铺成 3×3；CLAMP_TO_EDGE 把边缘纹素拉成条纹。UV 不越界时这两个参数看不出差别——包裹方式只管出界之后。
          - listitem [ref=f2e366]: 关掉「行序翻转 UNPACK_FLIP_Y」：红色标记格跳到右上角，整张贴图上下颠倒——开章第一个痛点当场复刻。
        - heading [level=2] [ref=f2e367]:
          - text: 验证：手算对账，门槛背书
          - link "Permalink to \"验证：手算对账，门槛背书\"" [ref=f2e368] [cursor=pointer]:
