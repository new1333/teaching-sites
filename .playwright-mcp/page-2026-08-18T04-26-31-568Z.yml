        - heading [level=2] [ref=f2e400]:
          - text: 小结
          - link "Permalink to \"小结\"" [ref=f2e401] [cursor=pointer]:
            - /url: "#小结"
            - text: "#"
        - paragraph [ref=f2e402]: 本章给世界穿上皮肤。纹理是贴在表面的图片数据，细节住在它那里而不是顶点表里——查表便宜、逐顶点变换贵。UV 坐标是贴纸上的归一化地址，(0,0) 在左下角、v 向上；归一化换来分辨率无关，立方体六面各铺满 [0,1]。纹素是纹理的像素，与屏幕像素两套户口；采样是片元着色器里按 UV 查表，每片元一次。UV 落在纹素之间由过滤裁决：NEAREST 谁近听谁的、放大即马赛克，LINEAR 按距离调匀、格边出过渡色。UV 出界由包裹方式裁决：REPEAT 取小数部分平铺，CLAMP_TO_EDGE 摁在边缘拉丝；WebGL 1 里非 2 的幂尺寸只有后者的份。上下颠倒是数据行序与 v 轴没对账：图片顶行直传落底边，UNPACK_FLIP_Y_WEBGL 在上传时倒一次行序；程序化数据按 UV 约定生成则免翻转。接线五步：createTexture、activeTexture + bindTexture、texImage2D、texParameteri、uniform1i 报单元号。实验场新增 texture/procedural 的 checkerboard——代码即图案，第 12 章组装世界时，地板与柱廊的纹样还从这领。下一章讲光照：顶点表里歇了一章的法线复工，颜色从「查表查来」变成「算出来」。
        - paragraph [ref=f2e403]: 读完本章，下面几问应该能脱口而出：
        - list [ref=f2e404]:
          - listitem [ref=f2e405]: 纹理 8×8 纹素、cells=4，UV (0.75, 0.25) 落在哪一格、取什么颜色？在 REPEAT 下 UV (1.75, 0.25) 呢？
          - listitem [ref=f2e406]: 同一张纹理，TEXTURE_MAG_FILTER 设 NEAREST 与 LINEAR，特写下各看到什么？哪个对应「马赛克块」？
          - listitem [ref=f2e407]: 图片上传后贴图上下颠倒，账出在哪一行数据？UNPACK_FLIP_Y_WEBGL 改变的是纹理坐标约定还是数据行序？
          - listitem [ref=f2e408]: 采样器 uniform1i 里填的 0 是什么编号？它和 createTexture 返回的对象是什么关系？
          - listitem [ref=f2e409]: 顶点表里的 UV 每面都是 (0,0) 到 (1,1)，为什么不用改顶点就能换 64×64 或 2048×2048 的贴图？
