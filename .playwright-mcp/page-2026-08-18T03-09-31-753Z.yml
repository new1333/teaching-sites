        - paragraph [ref=f1e230]: 这台机器冷清得反常：第 4 行只剩一个 -1，第 4 列只剩一个 -3——平移机器里热闹的两条街，在透视机器里各只剩一盏灯，全给深度让路。z 的映射顺带看一眼：视锥深度中点 (0, 0, -2) 过机器后 z_clip = -2×(-2) - 3 = 1、w = 2，z_ndc = 0.5，不是 0。深度映射不是线性的：近处的 z 分得细、远处的分得粗；深度缓冲第 8 章拿这本账记账。
        - paragraph [ref=f1e231]: fov 的账也跟一遍：同一个眼空间点 (0, 0.5, -2)，fov 90° 时 y_ndc = 0.25；fov 拉到 120°（广角镜头），f 缩到 0.577，y_ndc 缩到约 0.144——视野越宽，同一个东西越显得靠中间、显得小。演示里拖 fov 滑杆看的就是这笔账。
        - heading [level=2] [ref=f1e232]:
          - text: 宽高比：圆为什么会变椭圆
          - link "Permalink to \"宽高比：圆为什么会变椭圆\"" [ref=f1e233] [cursor=pointer]:
