          - listitem [ref=f1e537]: 视锥 near 边缘点 (0, 1, -1) 为什么恰好落 NDC (0, 1, -1)？设计指标是怎么反推出 m[5] 的？
          - listitem [ref=f1e538]: w = -z 里的负号为什么必须在那？去掉它，手算一个 z = -2 的点会落到哪？
          - listitem [ref=f1e539]: 画布 800×400、忘了除 aspect，半径 1 的圆在屏幕上横纵半径各约多少？
          - listitem [ref=f1e540]: 同高 2 的线段摆在 z = -1 和 z = -3：透视下 NDC 高各多少？正交下呢？
