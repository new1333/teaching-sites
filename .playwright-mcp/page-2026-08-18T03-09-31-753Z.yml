            - text: "#"
        - paragraph [ref=f1e283]: 透视不是唯一的「对」。工程制图、2D 游戏、UI 叠加层要另一条规矩：平行线保持平行、大小不随距离变，透视的收拢反而碍事。打个比方：正交投影是一台平行投影仪——光线全平行地打过去，像正午的太阳而不是客厅的灯泡，远近不影响大小。它也叫平行投影。
        - paragraph [ref=f1e284]: 机器不削帐篷，改成一个轴对齐的盒子：left、right、bottom、top 定四壁，near、far 定两刀。盒里的东西平移加缩放塞进操场——第 5 章 scale 加 translate 的老手艺。第 4 行照旧 (0, 0, 0, 1)：w 恒 1，透视除法照走、除 1 原样——机关在正交机器里刻意关着。
        - paragraph [ref=f1e285]: 跟算 ortho(-2, 2, -1.5, 1.5, 1, 3)：m[0] = 2/(2-(-2)) = 0.5、m[5] = 2/3、m[10] = -2/(3-1) = -1、m[14] = -(3+1)/(3-1) = -2。盒中心 (0, 0, -2)：z' = -1×(-2) + (-2) = 0，落回操场原点；z = -1 的 near 面落 -1、z = -3 的 far 面落 +1，两头钉死与透视一致。
        - paragraph [ref=f1e286]: 平行怎么验？取两条平行方向 d = (1, 0.5, -0.5)，从不同位置出发，过正交机器后方向都变成 (0.5, 2/3×0.5, 0.5)——完全相同，用第 4 章的叉积一算是零向量（叉积只对不平行的方向非零）。同样的两条线过透视机器，各深度缩各的，叉积非零。测试里两条路径各算一遍，对照着锁。
        - paragraph [ref=f1e287]:
          - text: 远近不缩的账：同高 2 的竖线段，正交下摆在 z = -1 与 z = -3，NDC 高度都是 4/3；透视下分别是 2 与 2/3。
          - strong [ref=f1e288]: 透视学眼睛，正交学图纸，按你要的样子选
          - text: ：3D 世界用透视；2D 俯视、工程图、等距风格用正交。
