        - paragraph [ref=f1e532]: 投影是把三维压进二维操场的那一步。视锥体是从眼睛削出的帐篷：fov 定张角、aspect 定宽窄、near 和 far 定两刀；「帐篷边缘恰落操场边缘」这两条设计指标，反推出 perspective 的 16 个数。透视除法是坐标除以深度 w：w = 1 时裁剪坐标与 NDC 重合，前几章一直活在这个特例里；perspective 把 -z 写进第 4 行，近大远小由管线白送的除法完成；深度中点落 NDC 0.5，z 的映射非线性。aspect 必须进矩阵，否则画布不是正方形时圆会变椭圆。正交是平行投影仪：w 恒 1、远近不缩、平行线保持平行，2D 与工程图的老朋友。
        - paragraph [ref=f1e533]: 第 5 章在 transformPoint 出口埋的「除以 w」本章兑现；模型矩阵和投影矩阵已经串好，下一章补上把世界搬到相机眼前的视图矩阵，MVP 就齐了。
