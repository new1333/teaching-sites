        - paragraph [ref=f1e234]: NDC 操场是正方形，画布几乎从来不是。viewport 映射用第 2 章像素与 NDC 互算的同一条：px = (x_ndc + 1)/2 × 宽，py = (1 − y_ndc)/2 × 高——y 要翻转，因为屏幕的 y 朝下。宽 800 高 400 的画布，操场横向拉 800、纵向拉 400，横向多拉一倍。若 x、y 在矩阵里用同一比例（m[0] = m[5]），眼空间里的圆到屏幕上就是椭圆。
