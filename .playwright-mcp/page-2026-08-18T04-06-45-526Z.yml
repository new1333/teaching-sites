        - paragraph [ref=e266]:
          - text: 立方体明明只有 8 个角点，顶点表怎么是 24 行？因为顶点不是角点。
          - strong [ref=e267]: 顶点是「位置 + 全部逐顶点属性」的整包
          - text: ：一个顶点格子里装一份 position、一份 normal、一份 uv。同一个角点被三张面共享，而三张面的法线各不相同——站在 +X 面上，法线是 (1,0,0)；同一个点站到 +Y 面上，法线成了 (0,1,0)。一个格子的 normal 字段装不下三个值，只能拆成三个顶点。UV 同理：立方体展开图上每面各铺满 [0,1]，同一角点在三张面的展开图里是三个不同位置。于是 6 面 × 4 顶点 = 24——顶点复用的边界就画在属性上：位置相同且所有属性都相同，才许合并。法线是第 10 章光照的入场券，UV 是第 9 章贴纹理的地址，现在先各就各位。
        - heading [level=2] [ref=e268]:
          - text: 缠绕方向：正反面藏在时针里
          - link "Permalink to \"缠绕方向：正反面藏在时针里\"" [ref=e269] [cursor=pointer]:
            - /url: "#缠绕方向-正反面藏在时针里"
            - text: "#"
        - paragraph [ref=e270]: 一张三角面在几何上没有正反——三个点连起来，从两面看是同一张面。但渲染需要区分：背面剔除要挑出「背对相机的面」，前提是每张面有公认的正面。判据必须是免费的：GPU 在光栅化时手里就有三个顶点的屏幕坐标，看三点连线是顺时针还是逆时针，一个符号就出结果。这就是缠绕方向（winding order）——顶点连成面时在屏幕上转出的时针方向。WebGL 的默认约定 frontFace(CCW)：从相机这边看，顶点逆时针 = 正面；顺时针 = 背面。
        - generic [ref=e271]:
          - button "Copy Code" [ref=e272] [cursor=pointer]
          - generic [ref=e273]: text
          - code [ref=e275]:
            - generic [ref=e276]: 从外面（+Z 一侧）看 +Z 面： 绕到盒子内部看同一张面：
            - generic [ref=e277]: 3----2 2----3
            - generic [ref=e278]: "| | | |"
            - generic [ref=e279]: 0----1 1----0
            - generic [ref=e280]: 0→1→2→3 逆时针 0→1→2→3 顺时针
            - generic [ref=e281]: （正面，画） （背面，可剔除）
        - paragraph [ref=e282]: 注意「时针」跟着观察者走：同一张 +Z 面，从外面看顶点 0→1→2→3 是逆时针；绕到盒子内部看同一串顶点，镜像翻转成顺时针。正反不是面的私有属性，是面与相机的关系。
        - paragraph [ref=e283]:
          - text: 纸面验一遍 +Z 面：0=(-1,-1)、1=(1,-1)、2=(1,1)。两邻边 (c1−c0)=(2,0)、(c2−c1)=(0,2)，第 4 章的叉积 (2,0,0)×(0,2,0) = (0,0,4)——z 分量为正，与面法线 (0,0,1) 同向。
          - strong [ref=e284]: 「从外面看逆时针」不必靠目测，叉积的符号就是机械证词
          - text: ，本章测试的缠绕断言用的正是这一手。这也解释了面数据表的角点顺序为什么是公开承诺：顺序一换，正反就翻。
        - heading [level=2] [ref=e285]:
          - text: 背面剔除：先手省工
          - link "Permalink to \"背面剔除：先手省工\"" [ref=e286] [cursor=pointer]:
            - /url: "#背面剔除-先手省工"
            - text: "#"
        - paragraph [ref=e287]: 正面有了公认判据，就能上背面剔除（backface culling）——背对相机的面整张不画。接线三行：
        - generic [ref=e288]:
          - button "Copy Code" [ref=e289] [cursor=pointer]
          - generic [ref=e290]: ts
          - code [ref=e292]:
            - generic [ref=e293]: // 用法示例：背面剔除
            - generic [ref=e294]: gl.frontFace(gl.CCW) // 默认值：屏幕上逆时针 = 正面
            - generic [ref=e295]: gl.cullFace(gl.BACK) // 默认值：剔除背面
            - generic [ref=e296]: gl.enable(gl.CULL_FACE) // 默认是关的，要手动开
        - paragraph [ref=e297]: 它跟深度测试分工明确：深度测试是「片元造出来之后逐像素比大小」，剔除是「片元造出来之前整张面跳过」——一个保正确、一个省工，后手先手各管一段。省多少：封闭物体任一时刻约一半的三角背对你，剔除后它们连光栅化都不进。第 1 章算过帧率预算，片元是像素级开销的大头——场景一大，这约一半的片元就是掉帧与否的分界线。
        - paragraph [ref=e298]: 凸物体还有个彩蛋：立方体是凸的——任取两点，连线全程在体内——所以它的自我遮挡只有「面背对相机」一种，正面之间永不互相遮挡。于是只开剔除、不开深度，立方体照样画得对（下面的演示可验）。非凸物体如 L 形积木、圆环，正面之间也会互相挡，两条规矩缺一不可。
