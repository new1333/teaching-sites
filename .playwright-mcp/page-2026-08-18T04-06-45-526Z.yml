          - link "Permalink to \"小结\"" [ref=e401] [cursor=pointer]:
            - /url: "#小结"
            - text: "#"
        - paragraph [ref=e402]: 本章立了两条规矩、攒了一件道具。规矩一：每个像素配一本深度账（深度缓冲），新片元更近才许覆盖（深度测试，LESS 对 clearDepth 1）。两个片元争一个像素时，绘制顺序不再影响结果，线框时代的欠债至此还清。规矩二：面有正反——缠绕方向从相机看逆时针为正，背面剔除把背对的面整张跳过，先手省工约一半片元。凸物体只靠剔除也能画对，非凸物体两条规矩缺一不可。道具是 geometry/cube 的 createCube()。面数据表摊平成 24 顶点 × 8 分量的交错缓冲——position 3 + normal 3 + uv 2；36 个索引一次 drawElements 引用完。顶点是「位置 + 全部逐顶点属性」的整包，所以是 24 份不是 8 份。下一章给立方体贴皮肤：UV 坐标终于开工，纹理从那章起住进显存。
        - paragraph [ref=e403]: 读完本章，下面几问应该能脱口而出：
        - list [ref=e404]:
          - listitem [ref=e405]: 两个片元 z_ndc 分别是 -0.2 和 +0.6，后到的是 +0.6：谁留在屏上？账本怎么走的？
          - listitem [ref=e406]: 忘了在 clear 里带 DEPTH_BUFFER_BIT，画面会出什么事故？用「旧账」说一遍。
          - listitem [ref=e407]: 同一个角点为什么在顶点表里有三行？什么时候它才可以合并成一行？
          - listitem [ref=e408]: 只开背面剔除、不开深度测试，立方体为什么也画得对？换成 L 形物体还成立吗？
          - listitem [ref=e409]: 交错布局里 normal 的偏移为什么是 12 字节？步长为什么是 32？
